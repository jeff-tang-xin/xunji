const ORG_TREE = [
  { key:'org-root', title:'玄机科技', value:'org-root', children:[
    { key:'org-rd', title:'平台研发部', value:'org-rd' },
    { key:'org-delivery', title:'交付部', value:'org-delivery', children:[
      { key:'org-d1', title:'交付一组', value:'org-d1' },
      { key:'org-d2', title:'交付二组', value:'org-d2' },
    ]},
    { key:'org-qa', title:'质量部', value:'org-qa' },
  ]},
];
const ORG_NAME = {}, ORG_PARENT = {}, ORG_CHILDREN = {};
(function walk(nodes, parent) {
  nodes.forEach(n => {
    ORG_NAME[n.key] = n.title;
    ORG_PARENT[n.key] = parent;
    ORG_CHILDREN[n.key] = (n.children || []).map(c => c.key);
    walk(n.children || [], n.key);
  });
})(ORG_TREE, null);
function subtreeOf(orgId) {
  const out = [];
  (function w(k) { out.push(k); (ORG_CHILDREN[k] || []).forEach(w); })(orgId);
  return out;
}

// ===== 工具函数 =====
function genPassword() {
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const sets = ['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '#$%&*@'];
  const chars = sets.map(pick);
  const all = sets.join('');
  while (chars.length < 12) chars.push(pick(all));
  for (let i = chars.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = chars[i]; chars[i] = chars[j]; chars[j] = t;
  }
  return chars.join('');
}
function legacyCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}
function copyText(text) {
  const done = () => message.success('已复制到剪贴板');
  const fail = () => message.warning('自动复制失败，请手动选择复制');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => { legacyCopy(text) ? done() : fail(); });
  } else {
    legacyCopy(text) ? done() : fail();
  }
}
function filterByScope(rows, scope, orgId, username) {
  if (scope === 'all') return rows;
  if (scope === 'under_org') { const set = subtreeOf(orgId); return rows.filter(r => set.indexOf(r.org) >= 0); }
  if (scope === 'org') return rows.filter(r => r.org === orgId);
  return rows.filter(r => r.creator === username); // only_create
}

      <Modal title="新建用户" open={open} onOk={submit} okText="创建" cancelText="取消"

        <Form form={form} layout="vertical">

            <Select mode="multiple" options={roleOptions} placeholder="选择角色（平台管理员为系统内置，不可授予）" />
          </Form.Item>
        </Form>
      </Modal>
      <Modal title="用户创建成功" open={!!created} onCancel={() => setCreated(null)}
        footer={<Button type="primary" onClick={() => setCreated(null)}>我已保存，关闭</Button>}>
        {created && <div>

            message="初始密码仅展示一次，请立即复制并转交用户；关闭后不可再查看（平台不存储明文密码）。" />
          <p style={{margin:'0 0 8px'}}>用户名：<b>{created.username}</b></p>

            <span className="xj-mono" style={{fontSize:16, fontWeight:600, letterSpacing:1}}>{created.password}</span>
            <Button size="small" onClick={() => copyText(created.password)}>复制</Button>
          </div>
          <p style={{margin:'12px 0 0'}}>
            <Text type="secondary" style={{fontSize:12}}>提示：admin 账号由系统首次启动自动初始化，随机密码仅控制台输出一次。</Text>
          </p>
        </div>}

  );
}

  const checked = menuChecked[activeId] || [];
  const onCheck = (keys) => {

  };
  return (
    <div style={{display:'flex', gap:16, alignItems:'flex-start'}}>

            { title:'工作流', dataIndex:'name' },
            { title:'所属组织', dataIndex:'org', render:v => ORG_NAME[v] || v },
            { title:'创建人', dataIndex:'creator', className:'xj-mono' },
            { title:'更新时间', dataIndex:'updatedAt', className:'xj-mono' },
          ]}/>
          <p style={{margin:'12px 0 0'}}>
            <Text type="secondary" style={{fontSize:12}}>
              演示说明：under_org / org 以演示用户所属组织为基准（如 chenxiao 属交付部：under_org 可见交付部 + 交付一组/二组，org 仅交付部本身）；only_create 仅显示该用户创建的行；all 全量可见。
            </Text>
          </p>
        </Card>
      </div>
    </div>
  );
}
// ===== 根组件 =====
function App() {
  const [users, setUsers] = useState(INITIAL_USERS);
  const [roles, setRoles] = useState(INITIAL_ROLES);
  const [menuChecked, setMenuChecked] = useState(INITIAL_MENU_CHECKED);
  const createUser = (vals) => setUsers(prev => [...prev, {
    id: 'u-' + (prev.length + 1) + '-' + Math.floor(Math.random() * 1000),
    username: vals.username, org: vals.org, roles: vals.roles,
    status: '启用', createdAt: dayjs().format('YYYY-MM-DD HH:mm:ss'),
  }]);
  const createRole = (vals) => setRoles(prev => [...prev, {
    id: 'r-' + (prev.length + 1) + '-' + Math.floor(Math.random() * 1000),
    name: vals.name, scope: vals.scope, builtin: false, desc: vals.desc || '（原型演示角色）',
  }]);
  const deleteRole = (id) => setRoles(prev => prev.filter(r => r.id !== id));
  return (
    <Shell active="perm">
      <Alert className="xj-proto-banner" type="info" showIcon
        message="静态原型：RBAC（用户→角色→菜单，角色可叠加）+ 组织树 + 数据权限四档（all / under_org / org / only_create，角色级配置，与菜单可见性正交）；用户仅由 admin 创建，密码随机生成、明文一次性展示（主文档 v0.9 Q13）。"/>
      <Tabs defaultActiveKey="user" items={[
        { key:'user', label:'用户管理', children:<UserTab users={users} roles={roles} onCreate={createUser}/> },
        { key:'role', label:'角色管理', children:<RoleTab roles={roles} onCreate={createRole} onDelete={deleteRole}/> },
        { key:'menu', label:'菜单权限', children:<MenuTab roles={roles} menuChecked={menuChecked} setMenuChecked={setMenuChecked}/> },
        { key:'org',  label:'组织与数据范围', children:<OrgTab roles={roles} users={users}/> },
      ]}/>
    </Shell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
