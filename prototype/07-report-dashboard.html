/* ---------- 手绘 SVG 图表（原型零依赖） ---------- */
function LineChart({ data }) {
  const W=560, H=200, P=40, min=230, max=295;
  const pts = data.map((v,i) => [P + i*(W-2*P)/(data.length-1), H-P - (v-min)*(H-2*P)/(max-min)]);
  const path = pts.map(p => p.join(',')).join(' ');
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
      {[240,260,280].map(v => { const y = H-P-(v-min)*(H-2*P)/(max-min);
        return <g key={v}><line x1={P} x2={W-P/2} y1={y} y2={y} stroke="#f0f0f0"/>
          <text x={4} y={y+4} fontSize="10" fill="#999">{v}万</text></g>; })}
      <polyline points={path} fill="none" stroke="#1677ff" strokeWidth="2"/>
      {pts.map(([x,y],i) => <circle key={i} cx={x} cy={y} r="2.5" fill="#1677ff">
        <title>{`D-${data.length-1-i}：¥${data[i]}万`}</title></circle>)}
      <text x={P} y={H-8} fontSize="10" fill="#999">14 天前</text>
      <text x={W-P-30} y={H-8} fontSize="10" fill="#999">昨日</text>
    </svg>
  );
}
function BarChart({ data }) {
  const W=560, H=200, P=36, maxV=95, bw=36;
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
      {data.map(([name,v],i) => { const h = v*(H-2*P)/maxV, x = P + i*(W-2*P)/data.length + 8, y = H-P-h;
        return <g key={name}>
          <rect x={x} y={y} width={bw} height={h} rx="3" fill={v>=60?'#1677ff':'#91caff'} opacity="0.9"/>
          <text x={x+bw/2} y={y-5} fontSize="11" fill="#555" textAnchor="middle">{v}</text>
          <text x={x+bw/2} y={H-P+14} fontSize="11" fill="#666" textAnchor="middle">{name}</text>
        </g>; })}
      <line x1={P} x2={W-P/2} y1={H-P} y2={H-P} stroke="#d9d9d9"/>
    </svg>
  );
}

/* ---------- 创建报表（workflow 必须包含页面生成节点 + 定时执行计划） ---------- */
function CreateModal({ open, onClose, onCreate }) {
  const [name, setName] = useState('');
  const [wf, setWf] = useState(null);
  const [cron, setCron] = useState('每日 08:00');
  const [ds, setDs] = useState('ERP 业务库（JDBC · connector.ds-erp）');
  return (
    <Modal title="创建报表" open={open} onCancel={onClose} width={580} okText="创建并纳入调度"
      onOk={() => {
        if (!name.trim() || !wf) { message.warning('请填写报表名称并选择 workflow'); return; }
        onCreate({ name:name.trim(), wf, cron, ds });
      }}>
      <Space direction="vertical" size={12} style={{width:'100%'}}>
        <div>
          <Typography.Paragraph type="secondary" style={{fontSize:12, marginBottom:4}}>报表名称</Typography.Paragraph>
          <Input placeholder="例如：销售运营日报" value={name} onChange={e => setName(e.target.value)}/>
        </div>
        <div>
          <Typography.Paragraph type="secondary" style={{fontSize:12, marginBottom:4}}>
            来源 workflow（<b style={{color:'#fa541c'}}>必须包含页面生成节点</b>，否则无法产出看板页面）</Typography.Paragraph>
          <Select style={{width:'100%'}} placeholder="选择已发布 workflow" value={wf} onChange={setWf}
            options={WF_OPTIONS.map(o => ({ value:o.v, disabled:!o.hasPage,
              label:<span className="xj-mono">{o.label}{o.hasPage
                ? <Tag color="green" style={{marginLeft:8}}>含看板渲染节点 ✓</Tag>
                : <Tag style={{marginLeft:8}}>无页面生成节点</Tag>}</span> }))}/>
        </div>
        <div>
          <Typography.Paragraph type="secondary" style={{fontSize:12, marginBottom:4}}>定时执行计划（SCHEDULE 触发器）</Typography.Paragraph>
          <Select style={{width:'100%'}} value={cron} onChange={setCron}
            options={['每日 08:00','每周一 07:30','每月 1 日 06:00','每 15 分钟（演示）'].map(v => ({ value:v, label:v }))}/>
        </div>

      </Space>
    </Modal>
  );
}

              { title:'执行计划', render:(_,r) => <span><Tag color="blue">SCHEDULE {r.cron}</Tag>{!r.enabled && <Tag>已停用</Tag>}</span> },
              { title:'最新执行', render:(_,r) => { const last = (RUNS[r.id] || [])[0];
                  return last ? <span>{last.at} <Tag color={last.status === 'SUCCESS' ? 'green' : 'red'}>{last.status}</Tag></span> : '—'; } },
              { title:'操作', render:(_,r) => <Space>
                  <a onClick={() => setCurrent(r)}>查看看板</a>
                  <a onClick={() => setShareRow(r)}>嵌入分享</a>
                </Space> },
            ]}
            dataSource={reports}/>
        </div>
      )}
      <CreateModal open={createOpen} onClose={() => setCreateOpen(false)}
        onCreate={r => {
          setReports(x => [{ id:'rp_' + String(x.length + 1).padStart(2,'0'),
            page:'看板渲染 · board.render', enabled:true, ...r }, ...x]);
          setCreateOpen(false);
          message.success('报表已创建并纳入调度（原型演示）：按计划定时执行，每次固化一份看板快照');
        }}/>
      {shareRow && <ShareModal report={shareRow} open onClose={() => setShareRow(null)}/>}
    </Shell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
